<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A calm, minimal to-do list. Add tasks with due dates, check them off, and pick up right where you left off.">
  <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
  <title>Tasks — a minimal to-do list</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f46e5'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app">
    <header class="header">
      <p class="eyebrow" id="today"></p>
      <h1 class="title">My tasks</h1>

      <div class="progress">
        <div class="progress__row">
          <p class="progress__text" id="progress-text" aria-live="polite">No tasks yet</p>
          <span class="progress__pct" id="progress-pct" aria-hidden="true">0%</span>
        </div>
        <div class="progress__track" id="progress-track" role="progressbar" aria-label="Tasks completed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress__fill" id="progress-fill"></div>
        </div>
      </div>
    </header>

    <form class="composer" id="task-form" autocomplete="off">
      <label for="task-input" class="sr-only">New task</label>
      <input
        type="text"
        id="task-input"
        class="composer__input"
        placeholder="What needs to be done?"
        maxlength="200"
        enterkeyhint="done"
      >
      <label class="composer__due" for="task-due">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span class="sr-only">Due date (optional)</span>
        <input type="date" id="task-due" class="composer__date">
      </label>
      <button type="submit" class="composer__add">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>
        <span>Add</span>
      </button>
    </form>

    <div class="toolbar">
      <div class="filters" role="group" aria-label="Filter tasks">
        <button type="button" class="filter" data-filter="all" aria-pressed="true">
          All <span class="filter__count" data-count="all">0</span>
        </button>
        <button type="button" class="filter" data-filter="active" aria-pressed="false">
          Active <span class="filter__count" data-count="active">0</span>
        </button>
        <button type="button" class="filter" data-filter="completed" aria-pressed="false">
          Completed <span class="filter__count" data-count="completed">0</span>
        </button>
      </div>
      <button type="button" class="clear" id="clear-completed" hidden>Clear completed</button>
    </div>

    <section aria-label="Task list">
      <ul class="list" id="task-list"></ul>

      <div class="empty" id="empty-state" hidden>
        <svg class="empty__art" viewBox="0 0 160 120" aria-hidden="true">
          <ellipse cx="80" cy="108" rx="52" ry="6" class="empty__shadow"/>
          <rect x="42" y="14" width="76" height="88" rx="12" class="empty__card"/>
          <rect x="62" y="8" width="36" height="14" rx="7" class="empty__clip"/>
          <rect x="56" y="40" width="10" height="10" rx="3" class="empty__box"/>
          <rect x="72" y="42" width="32" height="6" rx="3" class="empty__line"/>
          <rect x="56" y="58" width="10" height="10" rx="3" class="empty__box"/>
          <rect x="72" y="60" width="24" height="6" rx="3" class="empty__line"/>
          <rect x="56" y="76" width="10" height="10" rx="3" class="empty__box"/>
          <rect x="72" y="78" width="28" height="6" rx="3" class="empty__line"/>
          <circle cx="116" cy="88" r="16" class="empty__badge"/>
          <path d="M109 88.5l4.5 4.5 9-9" class="empty__check"/>
        </svg>
        <h2 class="empty__title" id="empty-title">Nothing on your list</h2>
        <p class="empty__text" id="empty-text">Add a task above to get started.</p>
      </div>
    </section>

    <footer class="footer">
      <p>Saved privately in this browser.</p>
    </footer>
  </main>

  <template id="task-template">
    <li class="task">
      <label class="task__main">
        <input type="checkbox" class="task__checkbox">
        <span class="task__box" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </span>
        <span class="task__body">
          <span class="task__title"></span>
          <span class="task__due" hidden>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            <span class="task__due-label"></span>
          </span>
        </span>
      </label>
      <button type="button" class="task__delete">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
    </li>
  </template>

  <script src="script.js" defer></script>
</body>
</html>
